name: Update GitHub dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate dashboard
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 scripts/generate_github_dashboard.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add assets/github-dashboard.svg

          if git diff --cached --quiet; then
            echo "Dashboard already up to date."
          else
            git commit -m "Update GitHub dashboard"
            git push
          fi